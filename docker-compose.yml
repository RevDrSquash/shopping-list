services:
  postgres:
    image: postgres:16
    container_name: shopping-list-postgres
    environment:
      POSTGRES_USER: shopping_list
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: shopping_list
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_list -d shopping_list"]
      interval: 5s
      timeout: 5s
      retries: 5

  edge:
    image: nginx:1.27-alpine
    container_name: shopping-list-edge
    ports:
      - "8080:80"
    environment:
      PORT: 80
      BACKEND_HOST: host.docker.internal.ipv4:8000
      FRONTEND_HOST: host.docker.internal.ipv4:3000
    volumes:
      - ./nginx:/etc/nginx/templates:ro
    extra_hosts:
      - "host.docker.internal.ipv4:host-gateway"

volumes:
  postgres_data:
