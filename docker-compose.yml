services:
  postgres:
    image: postgres:16
    container_name: shopping-list-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  edge:
    image: nginx:1.27-alpine
    container_name: shopping-list-edge
    ports:
      - "8080:80"
    environment:
      PORT: 80
      BACKEND_HOST: host.docker.internal:8000
      FRONTEND_HOST: host.docker.internal:3000
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
    volumes:
      - ./nginx:/etc/nginx/templates:ro

volumes:
  postgres_data:
