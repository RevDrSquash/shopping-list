services:
  postgres:
    image: postgres:16
    container_name: shopping-list-postgres
    environment:
      POSTGRES_USER: shopping_list
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: shopping_list
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_list -d shopping_list"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
